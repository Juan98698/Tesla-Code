<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi plan de práctica · Laboratorio JavaScript</title>
    <link rel="stylesheet" href="./estilos.css" />
    <script type="module" src="./vista.mjs"></script>
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">TeslaCode · Fundamentos con JavaScript</p>
      <h1>Mi plan de práctica</h1>
      <p>Calcula una meta, registra sesiones y recupera tus datos al volver.</p>
    </header>
    <main class="panel">
      <section aria-labelledby="titulo-plan">
        <h2 id="titulo-plan">Prepara el plan</h2>
        <form id="plan" novalidate>
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            maxlength="80"
            aria-describedby="aviso-plan"
            required
          />
          <div class="campos">
            <div>
              <label for="minutos">Minutos por día</label>
              <input
                id="minutos"
                name="minutos"
                type="number"
                min="0"
                max="120"
                step="1"
                value="30"
                aria-describedby="aviso-plan"
                required
              />
            </div>
            <div>
              <label for="dias">Días del plan</label>
              <input
                id="dias"
                name="dias"
                type="number"
                min="0"
                max="7"
                step="1"
                value="5"
                aria-describedby="aviso-plan"
                required
              />
            </div>
          </div>
          <button type="submit">Calcular plan</button>
        </form>
        <p id="aviso-plan" role="status"></p>
        <div id="resultado" class="resultado" role="region" aria-label="Resultado del plan"></div>
      </section>
      <section aria-labelledby="titulo-sesiones">
        <h2 id="titulo-sesiones">Registra sesiones</h2>
        <form id="sesion" novalidate>
          <label for="duracion">Minutos de la sesión</label>
          <input
            id="duracion"
            name="duracion"
            type="number"
            min="0"
            max="120"
            step="1"
            aria-describedby="aviso-sesiones"
            required
          />
          <div class="acciones">
            <button type="submit">Registrar sesión</button>
            <button id="deshacer" type="button">Deshacer última</button>
          </div>
        </form>
        <p id="aviso-sesiones" role="status"></p>
        <dl id="resumen"></dl>
        <ol id="registros" aria-label="Sesiones registradas"></ol>
        <div class="acciones">
          <button id="exportar" type="button">Descargar copia</button>
          <div>
            <label for="copia">Restaurar copia JSON</label>
            <input id="copia" type="file" accept=".json,application/json" />
          </div>
        </div>
      </section>
      <section class="sugerencias" aria-labelledby="titulo-sugerencias">
        <h2 id="titulo-sugerencias">Próximo paso</h2>
        <form id="busqueda">
          <label for="tema">Tema de práctica</label>
          <select id="tema" name="tema">
            <option value="ciclos">Ciclos</option>
            <option value="listas">Listas</option>
            <option value="funciones">Funciones</option>
          </select>
          <button type="submit">Buscar sugerencia</button>
        </form>
        <p id="estado-red" role="status">Las sugerencias se consultan cuando eliges Buscar.</p>
      </section>
    </main>
    <footer>
      <a href="./estudiante.zip" download>Descargar archivos para construir tu versión</a>
    </footer>
  </body>
</html>
