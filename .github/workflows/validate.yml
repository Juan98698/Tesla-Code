name: Validar plataforma
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - run: npm ci
      - run: npm run format:check
      - run: npm run validate
      - run: npm run technology:check
      - run: npm run test:coverage
      - run: python3 tests/python-examples.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cache
      - run: npm run test:module
      - run: npm run test:access
      - run: npm run test:e2e
      - run: npm run test:python
      - run: npm run test:console
      - run: npm run test:progress
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/python-examples.py
